[model]
# provider 是兼容旧配置的 Engine 选择器；厂商身份单独使用 vendor。
provider = "openai"
api_mode = "chat_completions"
vendor = "dashscope"
deployment = "dashscope-compatible"
model = "qwen-plus"
endpoint = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# Provider 能力声明；未知时省略并在 Trace 中明确标记 unknown，不能视为无限。
context_window_tokens = 131072
max_output_tokens = 8192
# tokenizer = "registered:qwen-plus" # 仅填写进程中已注册/可用的 tokenizer 标识
# 旧字段 base_url 仍兼容，但不能与 endpoint 同时配置。
# 这里只保存环境变量名；凭据值不得写入 TOML。
credential_env = "EDU_AGENT_API_KEY"
timeout_seconds = 1800
temperature = 0.0
max_retries = 2
retry_base_delay_seconds = 1.0
retry_max_delay_seconds = 8.0
# 合法 Retry-After 优先于本地 full-jitter 退避，但不会超过此上限。
retry_after_max_seconds = 60.0
# 并发和 breaker 均按冻结的规范 route identity 隔离。
route_max_concurrency = 4
route_state_capacity = 128
route_state_ttl_seconds = 900.0
circuit_failure_threshold = 3
circuit_cooldown_seconds = 30.0
# fallback_model = "Qwen/Qwen3-14B"
# fallback_base_url = "http://127.0.0.1:8001/v1"
# fallback_api_mode = "chat_completions" # 默认继承 primary 的冻结 mode
# fallback_context_window_tokens = 32768 # 配置 fallback 时必填，未知不视为无限
# fallback_max_output_tokens = 8192
# fallback_tokenizer = "registered:fallback"
# fallback key 使用 EDU_AGENT_FALLBACK_API_KEY，不写入 TOML。

[runtime]
max_model_calls = 12
max_tool_calls = 24
# 同一 assistant 回合只并发冻结 Manifest 明确允许的只读、无冲突调用。
tool_batch_max_workers = 4
# 每个工具仍受 Manifest timeout 限制；这里是运行时全局上限。
tool_call_timeout_seconds = 120
context_token_budget = 12000
# 每次模型请求都会真实设置该最大输出值，并从 context window 中预留。
output_token_reserve = 2048
recent_message_limit = 80
compression_enabled = true
compression_trigger_ratio = 0.7
compression_keep_recent = 12
compression_summary_max_chars = 4000
tool_result_inline_chars = 12000
tool_result_preview_chars = 1500
tool_turn_budget_chars = 32000
session_lease_seconds = 30
session_heartbeat_seconds = 10
run_stall_seconds = 90

[planning]
enabled = true
max_steps = 8
max_step_retries = 2
max_iterations = 12

[memory]
enabled = true
max_recalled_items = 6
max_item_chars = 800

[knowledge]
# 仅在 enabled=true 且数据库存在时暴露 retrieve_course_materials。
enabled = false
path = "~/.edu-agent/knowledge.db"
max_results = 5

[security]
require_write_approval = true
allow_local_code_execution = false
default_role = "teacher"

[code_execution]
# 只有真实隔离后端通过健康与安全能力门禁后，run_code 才会进入工具面。
enabled = false
provider = "disabled"
endpoint = "http://127.0.0.1:4000"
# Docker provider 必须使用不可变 digest；示例留空以保持默认关闭。
image = ""
docker_socket = "~/.docker/run/docker.sock"
docker_python_path = "/usr/bin/python3"
max_cpus = 1.0
allowed_languages = ["python"]
request_timeout_seconds = 15
health_interval_seconds = 30
max_source_bytes = 65536
max_stdin_bytes = 65536
max_cpu_time_seconds = 10
max_wall_time_seconds = 15
min_memory_mb = 384
max_memory_mb = 1024
max_output_bytes = 131072
max_processes = 32
max_file_size_mb = 32
max_artifact_bytes = 262144
network_policy = "disabled"
# token 只从 EDU_AGENT_JOBE_TOKEN 读取，不进入 TOML、日志或 SQLite。
token_env = "EDU_AGENT_JOBE_TOKEN"
# 仅在 scripts/code_sandbox_demo.py --e2e 对同一后端全部通过后改为 true。
security_attested = false

[storage]
state_path = "~/.edu-agent/state.db"
artifact_path = "~/.edu-agent/artifacts"

[scheduler]
enabled = false
lease_seconds = 300

[transaction]
approval_ttl_seconds = 900
outbox_lease_seconds = 30

[delegation]
# Only the concrete read-only teaching consumers use this surface.
enabled = true
max_depth = 1
max_children_per_parent = 8
max_concurrency = 3
child_timeout_seconds = 30
worker_lease_seconds = 45
max_model_calls_per_child = 2
max_tool_calls_per_child = 6
max_tokens_per_child = 4000
max_cost_usd_per_child = 0.05
max_root_model_calls = 16
max_root_tool_calls = 48
max_root_tokens = 32000
max_root_cost_usd = 0.40
allowed_tool_categories = ["query", "analysis", "knowledge"]
allowed_models = ["deterministic-readonly-v1"]
allowed_child_roles = ["student", "teacher"]
default_model = "deterministic-readonly-v1"
allow_child_delegation = false

[observability]
# 本地 Trace/JSON(L) 始终可用；第三方遥测默认关闭且不会导入 OTel 包。
otel_enabled = false
# otlp_endpoint = "http://127.0.0.1:4318/v1/traces"
trace_page_size = 100
export_preview_chars = 512

[api]
# API request lease 应覆盖同步请求超时；过期 claim 会先检查持久 run/operation 状态。
request_lease_seconds = 330
request_retention_seconds = 604800
failed_request_retention_seconds = 86400
request_gc_batch_size = 200
