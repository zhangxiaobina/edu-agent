name: edu-agent

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
      args:
        PYTHON_IMAGE: ${EDU_AGENT_PYTHON_IMAGE:-python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7}
        UV_IMAGE: ${EDU_AGENT_UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.16@sha256:440fd6477af86a2f1b38080c539f1672cd22acb1b1a47e321dba5158ab08864d}
    image: edu-agent-api:local
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:${EDU_AGENT_API_PORT:-8080}:8080"
    environment:
      EDU_AGENT_CONFIG: /etc/edu-agent/config.toml
      EDU_AGENT_API_HOST: 0.0.0.0
      EDU_AGENT_API_PORT: "8080"
      EDU_AGENT_DEMO_TOKEN_FILE: /run/secrets/edu_agent_demo_token
      EDU_AGENT_API_KEY_FILE: /run/secrets/edu_agent_api_key
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - edu_agent_state:/var/lib/edu-agent/state
      - edu_agent_artifacts:/var/lib/edu-agent/artifacts
      - type: bind
        source: ${EDU_AGENT_BACKUP_DIR:-./backups}
        target: /var/lib/edu-agent-backups
        read_only: false
      - type: bind
        source: ${EDU_AGENT_CONFIG_FILE:-./api/config.container.example.toml}
        target: /etc/edu-agent/config.toml
        read_only: true
    secrets:
      - edu_agent_demo_token
      - edu_agent_api_key
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,sys,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3));
          sys.exit(0 if data.get('ready') is True else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  edu_agent_state:
  edu_agent_artifacts:

secrets:
  edu_agent_demo_token:
    file: ${EDU_AGENT_DEMO_TOKEN_FILE:-./secrets/demo-token}
  edu_agent_api_key:
    file: ${EDU_AGENT_API_KEY_FILE:-./secrets/provider-api-key}
