name: edu-agent-code-execution

services:
  jobe:
    image: xiaobiny/jobe-custom@sha256:173036eb3b5cdc2a2634da0bd70eba56d22efced2b2981568359cc2c6bf63bd4
    platform: linux/amd64
    container_name: edu-agent-jobe
    ports:
      - "127.0.0.1:4020:80"
    networks:
      - jobe-isolated
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "/var/www/html/jobe/minimaltest.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  jobe-isolated:
    internal: true
