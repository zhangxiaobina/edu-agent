[project]
name = "edu-agent"
version = "0.1.0"
description = "可恢复、可审计的多工具教学 Agent Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "zhangxiaobina", email = "ruibin834@gmail.com" }]

# 数据层与教学算法仍以标准库为主；运行时、JSON Schema 校验、Agent 编排和
# Provider 适配使用下列锁定依赖。
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.40.0",        # 走 vLLM 的 OpenAI 兼容端点 / 通义千问兼容端点
    "pydantic>=2.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
rag = ["langchain-community>=0.3.0"]
dev = ["pytest>=8.0", "ruff>=0.6.0"]
otel = [
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edu_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
